[package]
name = "landed"
version = "0.1.0"
edition = "2021"
authors = ["Morgan Espitia"]
description = "Fail-closed Solana transaction execution: plan, gate, submit via RPC or Jito bundle, and know what happened"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ampactor-labs/landed"
readme = "README.md"
keywords = ["solana", "jito", "bundle", "execution", "transaction"]
categories = ["api-bindings", "finance"]

[dependencies]
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-sdk = "4"
solana-system-interface = { version = "3", features = ["bincode"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = "0.3"
